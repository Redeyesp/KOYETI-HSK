# ============================================================================
#  Build & publish KOYETI HSK firmware
#
#  push to main / manual run -> compile, keep the .bin files as a workflow
#                               artifact, update the web flasher on GitHub Pages
#
#  One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
# ============================================================================
name: Build KOYETI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core, U8g2 and esptool
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib update-index
          arduino-cli lib install "U8g2"
          pip install "esptool>=5,<6"

      - name: Compile KOYETI
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3 \
            --output-dir build \
            Koyeti

      - name: Package firmware and web flasher
        run: bash scripts/package_firmware.sh

      - name: Upload firmware files
        uses: actions/upload-artifact@v7
        with:
          name: KOYETI-HSK-firmware
          path: dist/
          if-no-files-found: error

      - name: Upload web flasher site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  pages:
    name: Deploy web flasher (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
